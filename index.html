<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialverse Mail Reader</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 30px; display: flex; justify-content: center; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        textarea { width: 90%; height: 110px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; margin-bottom: 12px; }
        
        /* Toggle Switch Styling */
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #f0f3f6; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ea44f; }
        input:checked + .slider:before { transform: translateX(22px); }

        button { background: #4a90e2; color: white; border: none; padding: 12px 25px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:disabled { background: #b0bec5; }
        #loader { margin-top: 15px; font-weight: bold; color: #333; display: none; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 550px; width: 90%; max-height: 80vh; overflow-y: auto; text-align: left; }
        .mail-box { border-left: 4px solid #4a90e2; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 12px; }
        .close-btn { background: #ff4757; color: white; padding: 6px 12px; border: none; border-radius: 6px; float: right; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Socialverse Mail Reader</h2>
    <p style="font-size: 12px; color: #666;">Auto-Login & Full Mail Extractor</p>
    
    <textarea id="credentials" placeholder="email|password (একত্রে একাধিক দিতে পারেন)"></textarea>

    <!-- Headless Mode Toggle -->
    <div class="toggle-container">
        <span>🙈 Hide Browser (Headless Mode):</span>
        <label class="switch">
            <input type="checkbox" id="headlessToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <button id="startBtn" onclick="startBot()">Start Mail Reader 🚀</button>

    <div id="loader">⏳ ব্রাউজার চালুর প্রস্তুতি চলছে...</div>
</div>

<div id="modalOverlay" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">Close</button>
        <h3>Extracted Mails</h3>
        <hr><br>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const socket = io('https://socialverse-bot.onrender.com');

    socket.on('bot-status', (data) => {
        document.getElementById('loader').innerText = `⏳ ${data.status}`;
    });

    socket.on('bot-complete', (data) => {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('loader').style.display = 'none';

        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = '';

        if (data.success && data.results && data.results.length > 0) {
            data.results.forEach((acc) => {
                if (acc.success) {
                    if (!acc.mails || acc.mails.length === 0) {
                        modalBody.innerHTML += `<div class="mail-box"><b>📧 Account: ${acc.email}</b><br>ইনবক্স ফাঁকা।</div>`;
                    } else {
                        acc.mails.forEach((mail) => {
                            modalBody.innerHTML += `
                                <div class="mail-box">
                                    <b>📧 Account: ${acc.email} | Mail #${mail.id}</b><br>
                                    <strong>Subject:</strong> ${mail.subject}<br>
                                    ${mail.content}
                                </div>`;
                        });
                    }
                } else {
                    modalBody.innerHTML += `<div class="mail-box" style="border-left-color: #ff4757;"><b>❌ Account: ${acc.email}</b><br><span style="color: red;">${acc.message}</span></div>`;
                }
            });
            document.getElementById('modalOverlay').style.display = 'flex';
        } else {
            alert(data.message || "কোনো ডাটা পাওয়া যায়নি!");
        }
    });

    function startBot() {
        const inputData = document.getElementById('credentials').value.trim();
        const isHeadless = document.getElementById('headlessToggle').checked;

        if (!inputData) {
            alert("ইমেইল ও পাসওয়ার্ড প্রদান করুন!");
            return;
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('loader').innerText = '⏳ সার্ভারে নির্দেশ পাঠানো হচ্ছে...';
        document.getElementById('loader').style.display = 'block';

        // সকেটে টেক্সট এবং টগল স্টেট পাঠানো হচ্ছে
        socket.emit('start-bot', {
            credentials: inputData,
            isHeadless: isHeadless
        });
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>

</body>
</html>
