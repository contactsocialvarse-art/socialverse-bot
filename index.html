<script>
    // 🔴 Render Live Server Connection
    const socket = io('https://social-verse-bot.onrender.com');

    // ব্যাকএন্ড থেকে প্রোগ্রেস স্ট্যাটাস পাওয়ার জন্য
    socket.on('bot-status', (data) => {
        document.getElementById('loader').innerText = `⏳ ${data.status}`;
    });

    socket.on('bot-complete', (data) => {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('loader').style.display = 'none';

        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = '';

        if (data.success && data.results && data.results.length > 0) {
            data.results.forEach((acc) => {
                if (acc.success) {
                    if (acc.mails.length === 0) {
                        modalBody.innerHTML += `<div class="mail-box"><b> Account: ${acc.email}</b><br>কোনো মেইল পাওয়া যায়নি বা ইনবক্স ফাঁকা।</div>`;
                    } else {
                        acc.mails.forEach((mail) => {
                            modalBody.innerHTML += `
                                <div class="mail-box">
                                    <b> Account: ${acc.email} | #Mail ${mail.id}:</b>
                                    ${mail.content}
                                </div>
                            `;
                        });
                    }
                } else {
                    modalBody.innerHTML += `<div class="mail-box" style="border-left-color: red;"><b> Account: ${acc.email}</b><br>Error: ${acc.message}</div>`;
                }
            });

            document.getElementById('modalOverlay').style.display = 'flex';
        } else {
            alert(data.message || "কোনো ডাটা প্রসেস করা যায়নি!");
        }
    });

    function startBot() {
        const inputData = document.getElementById('credentials').value.trim();
        if (!inputData) {
            alert("email|password প্রদান করুন!");
            return;
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('loader').innerText = '⏳ মেইল প্রসেস করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';
        document.getElementById('loader').style.display = 'block';

        // ব্যাকএন্ডে পুরো টেক্সট ডেটা সরাসরি পাঠানো (সিঙ্গেল ও মাল্টিপল দুটোই কাজ করবে)
        socket.emit('start-bot', inputData);
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>
