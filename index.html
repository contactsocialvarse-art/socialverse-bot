<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialverse Mail Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
            --secondary-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --text-primary: #2d3436;
            --container-bg: #ffffff;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-image: var(--secondary-gradient); font-family: 'Poppins', 'Noto Sans Bengali', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { width: 100%; max-width: 550px; background: var(--container-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-primary); padding: 35px; text-align: center; }
        .header { margin-bottom: 25px; }
        .header h2 { background-image: var(--primary-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 28px; font-weight: 600; }
        .header p { color: #666; font-size: 14px; margin-top: 5px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-weight: 500; font-size: 14px; display: block; margin-bottom: 8px; color: #444; }
        textarea { width: 100%; height: 110px; padding: 14px; border: 2px solid #e1e8ed; border-radius: 10px; font-size: 14px; resize: none; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #0072FF; }

        .btn-submit { width: 100%; background-image: var(--primary-gradient); color: white; border: none; padding: 15px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .loader { display: none; margin-top: 20px; font-weight: 500; color: #0072FF; font-size: 15px; }

        /* Modal / Pop-up Styling */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: #fff; width: 100%; max-width: 650px; border-radius: 16px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 85vh; display: flex; flex-direction: column; animation: popup 0.3s ease-out; }
        @keyframes popup { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; margin-bottom: 15px; }
        .modal-header h3 { font-size: 20px; color: #2d3436; }
        .close-btn { background: #ff4757; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .modal-body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .mail-box { background: #f8f9fa; border-left: 4px solid #0072FF; padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: #333; line-height: 1.5; text-align: left; }
        .mail-box b { color: #0072FF; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Socialverse Mail Reader</h2>
        <p>Auto-Login & Full Mail Extractor</p>
    </div>

    <div class="input-group">
        <label>Email Credentials</label>
        <textarea id="credentials" placeholder="email|password"></textarea>
    </div>

    <button class="btn-submit" id="startBtn" onclick="startBot()">Start Mail Reader 🚀</button>
    
    <div class="loader" id="loader">⏳ মেইল প্রসেস করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
</div>

<!-- Pop-up / Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>📩 All Inbox Messages</h3>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Messages will be injected here -->
        </div>
    </div>
</div>

<script>
    const socket = io('http://localhost:5000');

    socket.on('bot-complete', (data) => {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('loader').style.display = 'none';

        if (data.success) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            if (data.mails.length === 0) {
                modalBody.innerHTML = '<div style="text-align:center; padding: 20px; color: #777;">কোনো মেইল পাওয়া যায়নি বা ইনবক্স ফাঁকা।</div>';
            } else {
                data.mails.forEach((mail) => {
                    modalBody.innerHTML += `
                        <div class="mail-box">
                            <b>#Mail ${mail.id}:</b>
                            ${mail.content}
                        </div>
                    `;
                });
            }

            document.getElementById('modalOverlay').style.display = 'flex';
        } else {
            alert(data.message);
        }
    });

    function startBot() {
        const inputData = document.getElementById('credentials').value.trim();
        if (!inputData) {
            alert("email|password প্রদান করুন!");
            return;
        }

        const [email, password] = inputData.split('|');
        if (!email || !password) {
            alert("email|password সঠিক ফরম্যাটে দিন!");
            return;
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('loader').style.display = 'block';

        socket.emit('start-bot', { email: email.trim(), password: password.trim() });
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>

</body>
</html>
